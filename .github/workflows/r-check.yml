name: R Code Quality Check

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  R-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.0'
          use-public-rspm: true
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libnetcdf-dev \
            libhdf5-dev
      
      - name: Query dependencies
        run: |
          if [ -f "DESCRIPTION" ]; then
            install.packages('remotes')
            saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
            writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
          fi
        shell: Rscript {0}
      
      - name: Cache R packages
        if: runner.os != 'Windows'
        uses: actions/cache@v3
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-
      
      - name: Install dependencies
        run: |
          if [ -f "DESCRIPTION" ]; then
            install.packages(c("remotes", "rcmdcheck"))
            remotes::install_deps(dependencies = TRUE)
          fi
        shell: Rscript {0}
      
      - name: Check R code
        if: always()
        run: |
          if [ -f "DESCRIPTION" ]; then
            rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "warning", check_dir = "check")
          else
            echo "No DESCRIPTION file found, skipping R CMD check"
          fi
        shell: Rscript {0}
      
      - name: Upload check results
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: r-check-results
          path: check

  lintr:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.0'
      
      - name: Install lintr
        run: install.packages("lintr")
        shell: Rscript {0}
      
      - name: Lint R code
        run: |
          # Lint all R files
          r_files <- list.files(
            path = c(".", "r"), 
            pattern = "\\.R$", 
            full.names = TRUE, 
            recursive = FALSE
          )
          
          if (length(r_files) > 0) {
            results <- lintr::lint_package(
              path = ".",
              linters = lintr::linters_with_defaults(
                line_length_linter = lintr::line_length_linter(120),
                object_name_linter = NULL  # Allow both snake_case and camelCase
              )
            )
            print(results)
            
            # Save results
            saveRDS(results, "lintr_results.rds")
            
            # Fail if there are errors (not warnings)
            errors <- sapply(results, function(x) x$type == "error")
            if (any(errors)) {
              stop("Linting found errors")
            }
          } else {
            message("No R files found to lint")
          }
        shell: Rscript {0}
        continue-on-error: true
      
      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: lintr-results
          path: lintr_results.rds
